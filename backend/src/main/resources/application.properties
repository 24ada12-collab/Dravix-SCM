spring.application.name=dravix-scm
server.port=8080

# Database Configuration
# Default to file-based H2 database for zero-friction local Buildathon execution
# When local MySQL credentials are provided via DB_URL / DB_USERNAME / DB_PASSWORD, it seamlessly points to MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/dravix_scm;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart File Upload limits (max 10MB per verification document)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Logging
logging.level.com.dravix.scm=INFO
logging.level.org.springframework.security=WARN
